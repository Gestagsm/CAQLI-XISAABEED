<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2456d6">
<link rel="icon" href="icon.svg">
<title>Nidaamka Xisaabta</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#667085;--bd:#e4e7ec;--inc:#0a8f55;--exp:#d92d20;--acc:#2456d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c25;--tx:#eef0f4;--mut:#98a2b3;--bd:#2a3040;--inc:#32d583;--exp:#f97066;--acc:#7a9cff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 4px}
.sub{color:var(--mut);font-size:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.bal{text-align:center}
.bal small{color:var(--mut)}
.bal .n{font-size:34px;font-weight:700;margin:4px 0}
.row{display:flex;gap:10px}
.row>div{flex:1;text-align:center;padding:10px;border-radius:10px;background:var(--bg)}
.row b{display:block;font-size:17px;margin-top:2px}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:14px}
.seg button.on.i{background:var(--inc);color:#fff;border-color:var(--inc)}
.seg button.on.e{background:var(--exp);color:#fff;border-color:var(--exp)}
input,select{width:100%;padding:11px;margin-bottom:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
.add{width:100%;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:16px;font-weight:600}
.head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.head select{margin:0;flex:1}
.rng{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:8px}
.rng label{font-size:12px;color:var(--mut);min-width:0;display:block}
.rng input{margin:4px 0 0;min-width:0;max-width:100%;display:block;-webkit-appearance:none;appearance:none;height:46px;text-align:left}
.qk{display:flex;gap:8px;margin-bottom:12px}
.qk button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:13px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:480px}
th{background:var(--acc);color:#fff;text-align:left;padding:8px;font-weight:600;white-space:nowrap}
th.r,td.r{text-align:right}
td{padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
td.ds{white-space:normal;min-width:110px}
tr.op td{background:var(--bg);font-style:italic}
.del{background:none;border:0;color:var(--mut);font-size:16px;padding:2px 6px}
.empty{color:var(--mut);text-align:center;padding:14px}
.ex{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ex button{padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:14px}
.ex .pri{background:var(--acc);color:#fff;border-color:var(--acc);grid-column:1/3;font-weight:600}
#bs{color:var(--mut);font-size:12px;margin-top:8px}
.card.bal{background:linear-gradient(135deg,#2456d6,#6a3df0);color:#fff;border:0}
.card.bal small,.card.bal .sub{color:rgba(255,255,255,.8)}
.card.bal .row>div{background:rgba(255,255,255,.16)}
.card.bal .inc,.card.bal .exp{color:#fff}
.card.bal .n.exp{color:#ffd1cc}
main{padding-bottom:100px}
.card[hidden]{display:none}
.gby{margin-bottom:10px}
.gby .seg{margin-bottom:8px}
.gby .seg button{padding:8px 2px;font-size:13px}
.gby .seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.gch{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.gch .schip small{opacity:.7;margin-left:5px}
.gmode{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut)}
.gmode .seg{margin:0;flex:0 0 auto}
.gmode .seg button{flex:none;padding:5px 11px;font-size:12px}
.eb{margin-bottom:10px;border:1px solid var(--bd);border-radius:12px;overflow-x:auto}
.eh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);cursor:pointer;font-weight:700;font-size:14px}
.eh{flex-wrap:wrap}
.eh .enm{flex:1 1 auto;min-width:0}
.eh .ehs{display:flex;gap:8px;font-size:12px;flex-shrink:0;margin-left:auto}
.ehb{display:flex;gap:6px}
.ehb button svg{width:16px;height:16px;display:block}
.qk button.shbtn{display:inline-flex;align-items:center;justify-content:center;gap:7px}
.shbtn svg{width:17px;height:17px;flex:none}
.shgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;padding:8px 0 12px}
.shi{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--tx);font-size:12px;background:none;border:0;padding:0;cursor:pointer}
.shi i{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.shi svg{width:27px;height:27px}
#shmsg{text-align:center;min-height:18px;color:var(--inc);font-weight:700;font-size:13px}
.ehb button{padding:3px 9px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--tx);font-size:14px;line-height:1.2}
.eb table{margin:0}
#pgaF input{margin-bottom:8px}
.card.sv{background:linear-gradient(135deg,#0a8f55,#0e7490 55%,#2456d6);color:#fff;border:0;box-shadow:0 6px 18px rgba(14,116,144,.25)}
.sv .sh{margin-bottom:12px}.sv .sh b{font-size:15px}
.sv small,.sv .sublbl,.sv .sub{color:rgba(255,255,255,.8)}
.svtop{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.ringw{flex:0 0 100px;text-align:center}
.ring{position:relative;width:100px;height:100px}
.sv .rl{display:block;margin-top:6px;font-size:11px;line-height:1.25}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tk{fill:none;stroke:rgba(255,255,255,.25);stroke-width:9}
.ring .pg{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;transition:stroke-dasharray .6s ease}
.ring .pc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:21px;font-weight:800;line-height:1}
.ring .pc small{font-size:10px;font-weight:600;margin-top:3px}
.svnums{flex:1;min-width:0;display:grid;gap:8px}
.svb{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 11px}
.svb b{display:block;font-size:18px;margin:1px 0}
.svb small{font-size:11px;display:block}
.sv .neg{color:#ffd1cc}
.svst{font-size:13px;font-weight:700;margin:2px 0 8px}
.ms{display:flex;gap:6px;margin:8px 0 12px}
.ms span{flex:1;text-align:center;padding:6px 0;border-radius:999px;background:rgba(255,255,255,.16);font-size:12px;font-weight:700;color:rgba(255,255,255,.85)}
.ms span.ok{background:#fff;color:#0a8f55}
.sv .ncrow input{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff}
.sv .ncrow input::placeholder{color:rgba(255,255,255,.65)}
.sv .ncb{background:#fff;color:#0a8f55}
.svc{width:100%;height:auto;display:block;margin-top:10px}
.svc text{fill:rgba(255,255,255,.8);font-size:10px}
.svc .z{stroke:rgba(255,255,255,.4);stroke-width:1}
.sv .cap{font-size:11px;margin-top:10px;display:block}
.tips{margin:10px 0 0;padding:0;list-style:none}
.tips li{font-size:13px;line-height:1.4;padding:9px 10px;background:rgba(255,255,255,.14);border-radius:10px;margin-bottom:6px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet[hidden]{display:none}
.panel{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out;max-height:92vh;overflow-y:auto}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.x{background:none;border:0;color:var(--mut);font-size:20px}
input.big{font-size:30px;text-align:center;font-weight:700;padding:14px}
.cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-height:224px;overflow-y:auto;margin-bottom:10px;padding:2px}
.ctile{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:11px;line-height:1.2;text-align:center}
.ctile .ci{font-size:24px;line-height:1}
.ctile .cnm{word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ctile.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset;font-weight:700}
.ctile.add{border-style:dashed;color:var(--mut)}
.cdel{position:absolute;top:2px;right:6px;font-style:normal;color:var(--mut);font-size:15px}
.ncrow{display:flex;gap:8px;margin-bottom:10px}
.ncrow[hidden]{display:none}
.ncrow input{margin:0}
.nce{width:64px!important;text-align:center}
.ncb{padding:0 16px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:600;font-size:15px}
.svg{width:100%;height:auto;display:block;margin-top:8px}
.svg text{fill:var(--mut);font-size:10px}
.svg .bi{fill:var(--inc)}.svg .be{fill:var(--exp)}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}
.d{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.d.bi{background:var(--inc)}.d.be{background:var(--exp)}
.cb{margin-bottom:8px}
.cl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.ct{height:8px;background:var(--bg);border-radius:6px;overflow:hidden}
.cf{height:100%;background:var(--exp);border-radius:6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ft{text-align:center;font-size:12px;color:var(--mut);margin:22px 0 0;line-height:1.6}
.ft b{display:block;font-size:13px;color:var(--tx);opacity:.85;letter-spacing:.3px}
.upd small{display:block;font-size:11px;opacity:.85;margin-top:2px}
.uov{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--bg);text-align:center}
.uov[hidden]{display:none}
.uov .ub{font-size:30px;font-weight:800;letter-spacing:1px}
.uov .us{font-size:15px;color:var(--mut)}
.uov small{font-size:12px;color:var(--mut)}
.sel{display:flex;gap:6px}
#lang{width:auto;margin:0;padding:6px 8px;font-size:13px}
.card.bal{position:relative}
.curbtn{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600}
.clist button{display:flex;width:100%;justify-content:space-between;align-items:center;padding:13px 6px;background:none;border:0;border-bottom:1px solid var(--bd);color:var(--tx);font-size:16px;text-align:left}
.clist button.on{color:var(--acc);font-weight:700}
.clist small{color:var(--mut)}
h1{font-size:18px}
.tabs{margin-bottom:12px}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tabs button.on.ti{background:var(--inc);border-color:var(--inc)}
.tabs button.on.te{background:var(--exp);border-color:var(--exp)}
.qa{display:flex;gap:10px;margin-top:12px}
.qa button{flex:1;padding:13px 8px;border:0;border-radius:14px;font-size:15px;font-weight:700;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.qa #qai{color:#0a8f55}.qa #qae{color:#d92d20}
.upd{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--acc);color:#fff;padding:10px 12px;border-radius:12px;margin-bottom:10px;font-size:14px}
.upd[hidden]{display:none}
.upd button{border:0;border-radius:8px;padding:6px 12px;font-weight:700;background:#fff;color:var(--acc)}
.sublbl{font-size:12px;color:var(--mut);margin:2px 0 6px}
.subrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.schip{padding:7px 11px;border-radius:999px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:13px}
.schip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.schip.add{border-style:dashed;color:var(--mut)}
.sdel{font-style:normal;margin-left:6px;opacity:.7}
small.cs{display:block;color:var(--mut);font-size:11px;white-space:normal}
.lnk{background:none;border:0;color:var(--acc);font-size:12px;text-decoration:underline;padding:0}
.tabsec[hidden]{display:none}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-around;align-items:center;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.nav button i{font-style:normal;font-size:20px}
.nav button.on{color:var(--acc);font-weight:700}
.nav .plus{flex:0 0 54px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#2456d6,#6a3df0);color:#fff;font-size:30px;line-height:1;margin-top:-20px;box-shadow:0 4px 14px rgba(36,86,214,.45);justify-content:center}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sh .lnk{font-size:13px}
.rc{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.rc:last-child{border:0}
.rc .ci{font-size:20px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:10px}
.rc .mid{flex:1;min-width:0}
.rc .mid b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .mid small{color:var(--mut);font-size:11px}
.rc .amt{font-weight:700;font-size:14px;white-space:nowrap}
.stsum{display:flex;gap:8px;margin-bottom:12px}
.stsum div{flex:1;background:var(--bg);border-radius:10px;padding:8px 4px;text-align:center;font-size:11px;color:var(--mut)}
.stsum b{display:block;font-size:13px;margin-top:2px}
.morebtn{width:100%;padding:11px;margin-top:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--acc);font-weight:600;font-size:14px}
.morebtn[hidden]{display:none}
tr.gh td{background:var(--bg);font-weight:700;font-size:12px;padding:9px 8px;cursor:pointer}
tr.gh td span{float:right;font-weight:600;color:var(--mut)}
.pt{display:none}
@media print{
 body{background:#fff;color:#000}
 .noprint{display:none!important}
 .pt{display:block}
 .card{border:0;padding:0}
 th{background:#2456d6!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .del{display:none}
 .wrap{overflow:visible}
}
</style>
</head>
<body>
<main>
<div class="upd noprint" id="upd" hidden><span><span data-i="upd"></span><small>OHA Inc.</small></span><button id="updB" type="button" data-i="updBtn"></button></div>
<div class="top"><h1 data-i="title"></h1><div class="sel noprint"><select id="lang" class="noprint" aria-label="Language"><option value="so">Somali</option><option value="en">English</option><option value="no">Norsk</option></select></div></div>
<div class="sub noprint" id="st"></div>
<div class="pt" id="pt"></div>

<section class="tabsec" id="sec-home">
<div class="card bal">
<button class="curbtn noprint" id="curbtn" type="button"></button>
<small data-i="balance"></small>
<div class="n" id="bal">0.00</div>
<div class="row">
<div><small data-i="income"></small><b class="inc" id="inc">0.00</b></div>
<div><small data-i="expense"></small><b class="exp" id="exp">0.00</b></div>
</div>
<div class="sub" id="op" style="margin:10px 0 0"></div>
<div class="qa noprint"><button id="qai" type="button" data-i="addInc"></button><button id="qae" type="button" data-i="addExp"></button></div>
</div>
<div class="card sv noprint" id="sv"></div>
<div class="card"><div class="sh"><b data-i="recent"></b><button id="viewAll" type="button" class="lnk" data-i="viewAll"></button></div><div id="recent"></div></div>
</section>

<section class="tabsec" id="sec-st" hidden>
<div class="card">
<div class="stsum" id="stsum"></div>
<div class="seg tabs noprint"><button id="tS" class="on" type="button" data-i="statement"></button><button id="tI" class="ti" type="button" data-i="income"></button><button id="tE" class="te" type="button" data-i="expense"></button></div>
<div class="rng noprint">
<label><span data-i="from"></span><input type="date" id="df"></label>
<label><span data-i="to"></span><input type="date" id="dto"></label>
</div>
<div class="qk noprint">
<button id="qm" type="button" data-i="thisMonth"></button>
<button id="qy" type="button" data-i="thisYear"></button>
<button id="qa" type="button" data-i="all"></button>
</div>
<div class="qk noprint"><button id="bsh" type="button" class="shbtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg><span data-i="shareBtn"></span></button></div>
<div class="gby noprint"><div class="seg" id="gseg"><button type="button" data-g="" class="on" data-i="gAll"></button><button type="button" data-g="p">👤 <span data-i="gP"></span></button><button type="button" data-g="g">👥 <span data-i="gG"></span></button><button type="button" data-g="a">🛠 <span data-i="gA"></span></button></div><div id="gchips" hidden></div></div>
<input id="q" type="search" data-ph="searchPh">
<div class="wrap" id="list"></div>
<button class="morebtn noprint" id="more" type="button" hidden></button>
</div>
</section>

<section class="tabsec" id="sec-ch" hidden><div class="card noprint" id="ch"></div></section>

<section class="tabsec" id="sec-set" hidden>
<div class="card noprint">
<div class="sub" id="exr" style="margin-bottom:8px"></div>
<div class="ex">
<button class="pri" id="bxl" type="button">📊 Excel (.xlsx)</button>
<button id="bcsv" type="button">CSV</button>
<button id="bpdf" type="button" data-i="print"></button>
<button id="bx" type="button">⬇ Backup</button>
<button id="bm" type="button" data-i="restore"></button>
</div>
<input type="file" id="fi" accept=".json,application/json" hidden>
<div id="bs"></div>
</div>
<div class="sub noprint" style="text-align:center;margin-top:8px">v5.1 · <b>OHA Inc.</b> · <button id="chk" type="button" class="lnk" data-i="chkUpd"></button></div>
</section>
<footer class="ft"><b>© <span id="yr"></span> OHA Inc.</b><span data-i="rights"></span></footer>
</main>
<nav class="nav noprint" id="nav">
<button type="button" data-t="home" class="on"><i>🏠</i><span data-i="tHome"></span></button>
<button type="button" data-t="st"><i>📄</i><span data-i="statement"></span></button>
<button type="button" id="nadd" class="plus" aria-label="+">＋</button>
<button type="button" data-t="ch"><i>📊</i><span data-i="chart"></span></button>
<button type="button" data-t="set"><i>⚙️</i><span data-i="tSet"></span></button>
</nav>
<div class="sheet noprint" id="sheet" hidden>
<div class="panel">

const te=new TextEncoder();

  const nm=te.encode(fl.name),d=te.encode(fl.data),c=crc32(d);
  const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(33),...u32(c),...u32(d.length),...u32(d.length),...u16(nm.length),...u16(0)]);
  parts.push(lh,nm,d);
  cen.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(33),...u32(c),...u32(d.length),...u32(d.length),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
  off+=lh.length+nm.length+d.length;
 });
 let cs=0;cen.forEach(x=>cs+=x.length);
 const end=new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cs),...u32(off),...u16(0)]);

}

 });

 if(v.rows.length)S.push([cs_('B'+r,tr('total'),5),cf_('D'+r,`SUM(D${first}:D${last})`,v.inc,4),cf_('E'+r,`SUM(E${first}:E${last})`,v.exp,4),cf_('F'+r,`F${last}`,v.closing,4)]);
 // Summary sheet (by month, all data)
 const M={};v.rows.forEach(x=>{const k=x.d.slice(0,7);(M[k]=M[k]||{i:0,e:0})[x.type]+=x.amt});
 const keys=Object.keys(M).sort();
 const S2=[[tr('mMonth'),tr('colInc'),tr('colExp'),tr('mDiff')].map((t,i)=>cs_(String.fromCharCode(65+i)+'1',t,1))];
 let ti=0,te_=0;
 keys.forEach((k,i)=>{const n=i+2,a=r2(M[k].i),b=r2(M[k].e);ti+=a;te_+=b;
  S2.push([cs_('A'+n,mlabel(k)),cn_('B'+n,a,3),cn_('C'+n,b,3),cf_('D'+n,`B${n}-C${n}`,r2(a-b),3)])});
 if(keys.length){const n=keys.length+2;S2.push([cs_('A'+n,tr('total'),5),cf_('B'+n,`SUM(B2:B${n-1})`,r2(ti),4),cf_('C'+n,`SUM(C2:C${n-1})`,r2(te_),4),cf_('D'+n,`B${n}-C${n}`,r2(ti-te_),4)])}
 return zip([
  {name:'[Content_Types].xml',data:X+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
  {name:'_rels/.rels',data:X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
  {name:'xl/workbook.xml',data:X+`<workbook ${NS} xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${esc(tr('sh1'))}" sheetId="1" r:id="rId1"/><sheet name="${esc(tr('sh2'))}" sheetId="2" r:id="rId2"/></sheets></workbook>`},
  {name:'xl/_rels/workbook.xml.rels',data:X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
  {name:'xl/styles.xml',data:styles},
  {name:'xl/worksheets/sheet1.xml',data:sheet(S,[13,34,11,15,15,16,16,18,18,16,16],true)},
  {name:'xl/worksheets/sheet2.xml',data:sheet(S2,[22,16,16,16],true)}
 ]);
}

$('fi').onchange=async ev=>{
 const file=ev.target.files[0];if(!file)return;
 try{
  let arr=JSON.parse(await file.text());let n=0;
  if(arr&&!Array.isArray(arr)){if(!GOAL&&arr.goal>0){GOAL=r2(+arr.goal);saveGoal()}const cc=arr.cats||{};for(const ty of ['i','e'])(cc[ty]||[]).forEach(c=>{if(c&&c.k&&c.n&&!CC[ty].some(x=>x.k===c.k))CC[ty].push({k:String(c.k),ic:String(c.ic||'🏷'),n:String(c.n)})});saveCC();const sb=arr.subs||{};for(const k in sb)(sb[k]||[]).forEach(x=>{if(x&&x.k&&x.n){CS[k]=CS[k]||[];if(!CS[k].some(y=>y.k===x.k))CS[k].push({k:String(x.k),n:String(x.n)})}});saveCS();arr=arr.items||[]}
  for(const t of arr){
   if(!t||!t.id||!(t.amt>0)||(t.type!=='i'&&t.type!=='e'))continue;
   if(!items.some(x=>x.id===Number(t.id))){items.push({id:Number(t.id),type:t.type,desc:String(t.desc||''),amt:Number(t.amt),d:t.d||undefined,c:t.c||undefined,s:t.s||undefined,p:t.p?String(t.p):undefined,g:t.g?String(t.g):undefined,a:t.a?String(t.a):undefined});n++}
  }
  save();render();$('bs').textContent=tr('restored',{n});
 }catch(e){$('bs').textContent=tr('badFile')}
 ev.target.value='';
};

function stat(){
 const ready=!!(navigator.serviceWorker&&navigator.serviceWorker.controller);
 $('st').textContent=(navigator.onLine===false?'📴 ':'')+tr(ready?'offReady':'offWait');
}

function showUpd(){document.querySelectorAll('.yr2').forEach(e=>e.textContent=new Date().getFullYear());$('updov').hidden=false}
function doReload(){showUpd();setTimeout(()=>location.reload(),700)}
function goTo(u){location.replace(u)}
async function forceUpdate(){
 const b=$('chk');
 try{
  b.textContent=tr('updating');
  const r=await fetch(location.pathname+'?c='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw 0;
  showUpd();
  if(navigator.serviceWorker){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(x=>x.unregister()))}
  if(window.caches){for(const k of await caches.keys())await caches.delete(k)}
  goTo(location.pathname+'?u='+Date.now());
 }catch(e){$('updov').hidden=true;b.textContent=tr('needNet');setTimeout(()=>{b.textContent=tr('chkUpd')},3000)}
}
$('chk').onclick=forceUpdate;
const editing=()=>!$('sheet').hidden||!$('csheet').hidden;
function applyUpdate(){if(editing())$('upd').hidden=false;else doReload()}
if(navigator.serviceWorker){
 const had=!!navigator.serviceWorker.controller;let reloaded=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{stat();if(had&&!reloaded){reloaded=true;applyUpdate()}});
 navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='updated'&&!reloaded){reloaded=true;applyUpdate()}});
}
$('updB').onclick=()=>doReload();

 chips();render();
}
